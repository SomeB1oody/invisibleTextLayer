name: Deploy the page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A new push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Stage the site
        # dist/artifact.html has no document wrapper. It belongs to the
        # Artifact host and not to a web server, so the site gets only
        # dist/index.html. The .nojekyll file stops the Jekyll step.
        run: |
          mkdir -p site
          cp dist/index.html site/index.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          # The path is relative to the workspace, not to the working directory.
          path: web/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
